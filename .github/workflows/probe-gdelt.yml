name: ทดสอบ GDELT (ชั่วคราว)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          API = "https://api.gdeltproject.org/api/v2/doc/doc"
          D = "(domainis:reuters.com OR domainis:cnbc.com OR domainis:marketwatch.com OR domainis:apnews.com OR domainis:finance.yahoo.com)"
          COMB = '(oil OR crude OR brent OR gold OR tariff OR tariffs OR nvidia OR semiconductor OR chips OR "rate cut" OR "rate hike" OR "cuts rates" OR "raises rates")'
          cases = [
            ("combined+domains 2024", COMB + " " + D + " sourcelang:english", "20240301000000", "20240308000000", "HybridRel"),
            ("combined no domains 2024", COMB + " sourcelang:english", "20240301000000", "20240308000000", "HybridRel"),
            ("oil+domains 2024", "(oil OR crude OR brent) " + D + " sourcelang:english", "20240301000000", "20240308000000", "DateAsc"),
            ("oil+domains 2021", "(oil OR crude OR brent) " + D + " sourcelang:english", "20210301000000", "20210308000000", "DateAsc"),
            ("oil+domains 2018", "(oil OR crude OR brent) " + D + " sourcelang:english", "20180301000000", "20180308000000", "DateAsc"),
            ("oil reuters only 2018", "(oil OR crude) domainis:reuters.com", "20180301000000", "20180308000000", "DateAsc"),
            ("oil any 2017", "oil sourcelang:english", "20170301000000", "20170308000000", "DateAsc"),
          ]
          for name, q, s, e, sort in cases:
              p = {"query": q, "mode": "ArtList", "format": "json", "maxrecords": "250", "sort": sort, "startdatetime": s, "enddatetime": e}
              try:
                  with urllib.request.urlopen(urllib.request.Request(API + "?" + urllib.parse.urlencode(p), headers={"User-Agent": "KrongSetthakit/0.1"}), timeout=60) as r:
                      body = r.read().decode("utf-8", "replace").strip()
                  if body.startswith("{"):
                      arts = json.loads(body).get("articles", [])
                      print(f"{name}: {len(arts)} articles; e.g. {[a.get('title','')[:60] for a in arts[:2]]}")
                  else:
                      print(f"{name}: NON-JSON {len(body)}b: {body[:200]!r}")
              except Exception as ex:
                  print(f"{name}: ERROR {ex}")
              time.sleep(10)
          PY
