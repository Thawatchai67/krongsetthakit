name: ดึงข่าวย้อนหลัง

# ดึงหัวข่าวต่างประเทศจาก GDELT ย้อนไปถึงปี 2017 ทีละช่วง ทำต่อจากจุดเดิมทุกรอบ (data/gdelt_state.json)
# รันเองทุก 6 ชั่วโมงจนครบ หลังจากนั้นจะเก็บเฉพาะสัปดาห์ล่าสุดเพิ่ม
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: เก็บข่าวย้อนหลัง (สูงสุด 5 ชม. แล้วเซฟไว้ทำต่อ)
        run: python scripts/backfill_gdelt.py collect --minutes 290
      - name: ราคาย้อนหลังเต็มช่วง
        run: python scripts/fetch_prices.py --range 10y || echo "ดึงราคาไม่สำเร็จ ใช้ราคาเดิม"
      - name: รวมข่าวย้อนหลังและวัดผล
        run: |
          python scripts/backfill_gdelt.py merge
          python scripts/track_signals.py
      - name: บันทึกผล
        if: always()
        run: |
          git config user.name "krongsetthakit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && exit 0
          git commit -m "ข่าวย้อนหลังจาก GDELT ถึง $(python -c 'import json;print(json.load(open("data/gdelt_state.json")).get("next",""))' 2>/dev/null)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
