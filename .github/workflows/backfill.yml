name: ดึงข่าวย้อนหลัง

on:
  workflow_dispatch:
    inputs:
      days:
        description: "ย้อนหลังกี่วัน"
        default: "85"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ดึงข่าวย้อนหลังจาก GDELT
        run: python scripts/backfill_gdelt.py --days "${{ github.event.inputs.days }}"
      - name: วัดผลสัญญาณ
        run: python scripts/track_signals.py
      - name: บันทึกผล
        run: |
          git config user.name "krongsetthakit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "ข่าวย้อนหลังจาก GDELT"
          git pull --rebase origin main && git push
