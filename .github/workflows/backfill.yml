name: ดึงข่าวย้อนหลัง

# ดึงหัวข่าวต่างประเทศจาก GDELT ตั้งแต่ปี 2017 แยกงานทีละปีรันพร้อมกัน แล้วรวมผล วัดผลกับราคาย้อนหลัง
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: เก็บข่าวปี ${{ matrix.year }}
        run: python scripts/backfill_gdelt.py collect --start ${{ matrix.year }}-01-01 --end $(( ${{ matrix.year }} + 1 ))-01-01 --out parts/${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.year }}
          path: parts/${{ matrix.year }}.json

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: ราคาย้อนหลังเต็มช่วง
        run: python scripts/fetch_prices.py --range 10y
      - name: รวมข่าวย้อนหลัง
        run: python scripts/backfill_gdelt.py merge parts/*.json
      - name: วัดผลสัญญาณ
        run: python scripts/track_signals.py
      - name: บันทึกผล
        run: |
          git config user.name "krongsetthakit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "ข่าวย้อนหลังจาก GDELT ตั้งแต่ 2017"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
