name: อัปเดตข่าว

on:
  schedule:
    - cron: "7 * * * *"   # ทุกชั่วโมง (UTC)
  workflow_dispatch: {}    # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ติดตั้ง feedparser
        run: pip install -r requirements.txt
      - name: ทดสอบกฎ
        run: python tests/test_rules.py
      - name: ดึงและกรองข่าว
        run: python scripts/fetch_news.py
      - name: ดึงราคาหุ้น (ถ้าพังจะข้าม ไม่กระทบข่าว)
        run: python scripts/fetch_prices.py || echo "ดึงราคาไม่สำเร็จ ข้ามไปก่อน"
      - name: บันทึกผลถ้ามีการเปลี่ยนแปลง
        run: |
          if [ -n "$(git status --porcelain docs/news.json docs/prices.json)" ]; then
            git config user.name "krongsetthakit-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/news.json docs/prices.json 2>/dev/null || git add docs/news.json
            git commit -m "อัปเดตข่าว $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
