name: อัปเดตข่าว

on:
  schedule:
    - cron: "7 * * * *"   # ทุกชั่วโมง (UTC)
  workflow_dispatch: {}    # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ติดตั้ง feedparser
        run: pip install -r requirements.txt
      - name: ทดสอบกฎ
        run: python tests/test_rules.py
      - name: ดึงและกรองข่าว
        run: python scripts/fetch_news.py
      - name: ดึงราคาหุ้น (ถ้าพังจะข้าม ไม่กระทบข่าว)
        # ถ้าราคาตลาด (น้ำมัน ทอง บอนด์ ฯลฯ) ย้อนหลังยังไม่ถึง 10 ปี ให้ดึงเต็มช่วงรอบเดียว
        run: |
          R=$(python -c "import json;h=json.load(open('data/price_history.json'));print('--range 10y' if min(len(h.get('M:'+k,{})) for k in ('OIL','GOLD','US10Y','USDTHB','NDX'))<1000 else '')" 2>/dev/null)
          python scripts/fetch_prices.py $R || echo "ดึงราคาไม่สำเร็จ ข้ามไปก่อน"
      - name: ปฏิทินข่าวแรง + ผลหลังข่าว (ถ้าพังจะข้าม)
        run: python scripts/fetch_calendar.py || echo "ดึงปฏิทินไม่สำเร็จ ข้ามไปก่อน"
      - name: เก็บสถิติความแม่นของสัญญาณ
        run: python scripts/track_signals.py || echo "เก็บสถิติไม่สำเร็จ ข้ามไปก่อน"
      - name: ทดสอบกฎกับราคาย้อนหลัง 10 ปี
        run: python scripts/validate_rules.py || echo "ทดสอบกฎไม่สำเร็จ ข้ามไปก่อน"
      - name: บันทึกผลถ้ามีการเปลี่ยนแปลง
        run: |
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "krongsetthakit-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs data
            git commit -m "อัปเดตข่าว $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
