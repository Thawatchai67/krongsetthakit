<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กรองเศรษฐกิจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ทิศทาง: หน้าอ่านข่าวแบบสแกนเร็ว พื้นกระดาษโทนฟ้าอ่อน หมึกกรมท่า สีเน้นเขียวหยก
   สีสถานะ (ได้ประโยชน์/ถูกกดดัน/จับตา) แยกจากสีเน้น และมีสัญลักษณ์กำกับเสมอ */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #5a6b78;
  --line: #dbe3e8;
  --accent: #0d6b62;
  --accent-soft: #dff1ee;
  --good: #1a7a3e;
  --good-soft: #e0f3e6;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --watch: #8a5a00;
  --watch-soft: #fbefd2;
  --font-display: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d; --surface: #16222a; --ink: #e8eff3; --muted: #93a5b1; --line: #263641;
    --accent: #5fd1c3; --accent-soft: #123a37;
    --good: #6fd391; --good-soft: #163423;
    --bad: #ff8f86; --bad-soft: #3a1a18;
    --watch: #f0c56a; --watch-soft: #3a2d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d; --surface: #16222a; --ink: #e8eff3; --muted: #93a5b1; --line: #263641;
  --accent: #5fd1c3; --accent-soft: #123a37;
  --good: #6fd391; --good-soft: #163423;
  --bad: #ff8f86; --bad-soft: #3a1a18;
  --watch: #f0c56a; --watch-soft: #3a2d10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.875rem; }
.banner { background: var(--watch-soft); color: var(--watch); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.875rem; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab, .chip {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; min-height: 40px;
}
.chip { font-size: 0.875rem; padding: 4px 12px; min-height: 36px; }
.tab[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.tab:focus-visible, .chip:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; white-space: nowrap; }

section { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; flex-direction: column; gap: 2px; }
.sec-head p { margin: 0; color: var(--muted); font-size: 0.875rem; }

.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card-top h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
.count { color: var(--muted); font-size: 0.8125rem; white-space: nowrap; }
.impact { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.impact:first-of-type { border-top: 0; padding-top: 0; }
.impact-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font-size: 0.8125rem; font-weight: 600; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.watch { background: var(--watch-soft); color: var(--watch); }
.sector { font-weight: 600; }
.why { color: var(--muted); font-size: 0.875rem; margin: 0; }
.tickers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.tk { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; }
details { font-size: 0.875rem; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; min-height: 32px; display: flex; align-items: center; }
details ul { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }

.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.item a.title { color: var(--ink); font-weight: 600; text-decoration: none; text-wrap: pretty; }
.item a.title:hover { text-decoration: underline; }
.item .sum { margin: 0; color: var(--muted); font-size: 0.875rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.tag { color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 8px; font-weight: 500; }
.sig { color: var(--watch); background: var(--watch-soft); border-radius: 6px; padding: 0 8px; font-weight: 600; }
.region { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.disclaimer { color: var(--muted); font-size: 0.8125rem; border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: no-preference) { .tab, .chip { transition: background 0.15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>กรองเศรษฐกิจ</h1>
    <div class="meta" id="meta">กำลังโหลดข่าว…</div>
  </header>
  <div id="banner"></div>

  <div class="tabs" role="group" aria-label="เลือกแหล่งข่าว" id="tabs"></div>

  <section aria-labelledby="sig-h">
    <div class="sec-head">
      <h2 id="sig-h">สัญญาณเด่น 48 ชม.</h2>
    </div>
    <div class="cards" id="signals"></div>
  </section>

  <section aria-labelledby="news-h">
    <div class="sec-head">
      <h2 id="news-h">ข่าว</h2>
      <p id="count"></p>
    </div>
    <div class="chips" role="group" aria-label="กรองตามหมวด" id="chips"></div>
    <ul class="news" id="news"></ul>
  </section>

  <p class="disclaimer">คัดกรองอัตโนมัติ ไม่ใช่คำแนะนำการลงทุน ตรวจสอบก่อนตัดสินใจทุกครั้ง</p>
</div>

<script>
(function () {
  var state = { region: "all", cat: null, data: null };
  var REGIONS = [["all", "ทั้งหมด"], ["TH", "ข่าวไทย"], ["GLOBAL", "ต่างประเทศ"]];
  var EFFECT = {
    "ได้ประโยชน์": ["good", "▲ "],
    "ถูกกดดัน": ["bad", "▼ "],
    "ต้องจับตา": ["watch", "◆ "]
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }
  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 0) s = 0;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " นาทีที่แล้ว";
    if (s < 86400) return Math.round(s / 3600) + " ชั่วโมงที่แล้ว";
    return Math.round(s / 86400) + " วันที่แล้ว";
  }
  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Bangkok" });
    } catch (e) { return iso; }
  }

  function renderTabs() {
    $("tabs").innerHTML = REGIONS.map(function (r) {
      return '<button class="tab" type="button" data-r="' + r[0] + '" aria-pressed="' + (state.region === r[0]) + '">' + r[1] + "</button>";
    }).join("");
  }

  function visibleItems() {
    return state.data.items.filter(function (it) {
      return (state.region === "all" || it.region === state.region) &&
             (!state.cat || it.categories.indexOf(state.cat) >= 0);
    });
  }

  function renderChips() {
    var names = state.data.meta.categories, counts = {};
    state.data.items.forEach(function (it) {
      if (state.region !== "all" && it.region !== state.region) return;
      it.categories.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; });
    });
    var ids = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var html = '<button class="chip" type="button" data-c="" aria-pressed="' + (!state.cat) + '">ทุกหมวด</button>';
    ids.forEach(function (c) {
      html += '<button class="chip" type="button" data-c="' + esc(c) + '" aria-pressed="' + (state.cat === c) + '">' +
        esc(names[c] || c) + " (" + counts[c] + ")</button>";
    });
    $("chips").innerHTML = html;
  }

  function renderSignals() {
    var sigs = state.data.signals || [];
    if (!sigs.length) {
      $("signals").innerHTML = '<div class="empty">ยังไม่มีสัญญาณใน 48 ชม.</div>';
      return;
    }
    $("signals").innerHTML = sigs.map(function (s) {
      var impacts = s.impacts.map(function (im) {
        var e = EFFECT[im.effect] || ["watch", "◆ "];
        var tk = "";
        if (im.set && im.set.length) tk += '<span>หุ้นไทย</span>' + im.set.map(function (t) { return '<span class="tk">' + esc(t) + "</span>"; }).join("");
        if (im.us && im.us.length) tk += '<span>สหรัฐ</span>' + im.us.map(function (t) { return '<span class="tk">' + esc(t) + "</span>"; }).join("");
        return '<div class="impact"><div class="impact-head"><span class="pill ' + e[0] + '">' + e[1] + esc(im.effect) +
          '</span><span class="sector">' + esc(im.sector) + '</span></div>' +
          '<p class="why">' + esc(im.why) + '</p><div class="tickers">' + tk + "</div></div>";
      }).join("");
      var ev = s.evidence.map(function (x) {
        return '<li><a href="' + esc(safeUrl(x.link)) + '" target="_blank" rel="noopener noreferrer">' + esc(x.title) +
          "</a> <span class=\"meta\">" + esc(x.source) + " · " + ago(x.published) + "</span></li>";
      }).join("");
      return '<article class="card"><div class="card-top"><h3>' + esc(s.name) + '</h3><span class="count">' + s.count +
        " ข่าว</span></div>" + impacts + "<details><summary>ข่าวต้นทาง</summary><ul>" + ev + "</ul></details></article>";
    }).join("");
  }

  function renderNews() {
    var items = visibleItems(), names = state.data.meta.categories;
    $("count").textContent = items.length + " ข่าว";
    if (!items.length) { $("news").innerHTML = '<li class="empty">ไม่มีข่าวในตัวกรองนี้</li>'; return; }
    $("news").innerHTML = items.map(function (it) {
      var tags = it.categories.length ? '<span class="tag">' + esc(names[it.categories[0]] || it.categories[0]) + "</span>" : "";
      var sigs = (it.signals || []).map(function (sid) {
        var found = (state.data.signals || []).filter(function (s) { return s.id === sid; })[0];
        return '<span class="sig">⚑ ' + esc(found ? found.name : sid) + "</span>";
      }).join("");
      return '<li class="item"><a class="title" href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" +
        (it.summary && it.summary.length > 20 && it.lang !== "th" ? '<p class="sum">' + esc(it.summary) + "</p>" : "") +
        '<div class="row"><span class="region">' + (it.region === "TH" ? "ไทย" : "ต่างประเทศ") + "</span><span>" + esc(it.source) +
        '</span><span title="' + esc(fmtDate(it.published)) + '">' + ago(it.published) + "</span>" + tags + sigs + "</div></li>";
    }).join("");
  }

  function renderAll() { renderTabs(); renderChips(); renderSignals(); renderNews(); }

  function init(data) {
    state.data = data;
    var m = data.meta;
    $("meta").textContent = "อัปเดต " + fmtDate(m.generated_at);
    if (m.snapshot_note) $("banner").innerHTML = '<div class="banner">' + esc(m.snapshot_note) + "</div>";
    else if (m.feed_errors && m.feed_errors.length) $("banner").innerHTML = '<div class="banner">ดึงไม่ได้: ' + esc(m.feed_errors.map(function (e) { return e.feed; }).join(", ")) + "</div>";
    renderAll();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t || !state.data) return;
    if (t.dataset.r) { state.region = t.dataset.r; state.cat = null; renderAll(); }
    else if (t.hasAttribute("data-c")) { state.cat = t.dataset.c || null; renderChips(); renderNews(); }
  });

  if (window.__NEWS__) { init(window.__NEWS__); return; }
  fetch("news.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(init)
    .catch(function (err) {
      $("meta").textContent = "โหลดข่าวไม่สำเร็จ: " + err.message + " (ถ้าเปิดไฟล์โดยตรง ให้เปิดผ่านเว็บเซิร์ฟเวอร์ เช่น python -m http.server)";
    });
})();
</script>
</body>
</html>
