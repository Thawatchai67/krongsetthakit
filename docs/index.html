<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>กรองเศรษฐกิจ</title>
<script>
  /* ใช้ธีมที่เคยเลือกไว้ทันที ก่อนหน้าเว็บวาด กันจอกะพริบ */
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* หลักการ: เปิดมาแล้วได้คำตอบทันที (วันนี้ต้องรู้ + ข่าวเด่น) แล้วค่อยพาไปเรื่องต่อเนื่องและหุ้นของคุณ
   มือถือ: คอลัมน์เดียว เรียงจากสำคัญสุด  คอม (>=1024px): 3 คอลัมน์ ซ้ายเรื่องติดตาม กลางข่าว ขวาหุ้นของคุณ
   สีพื้นเป็นกลางทั้งหมด สีแดง/เขียวใช้เฉพาะเครื่องหมาย ▲▼◆ และตัวเลข สีน้ำเงินใช้กับสิ่งที่กดได้และของใหม่ */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eceff3; --ink: #121b26; --muted: #5b6878; --line: rgba(18, 27, 38, 0.1);
  --hero: #121b26; --hero-ink: #f4f5f7; --hero-soft: #a9b4c2;
  --accent: #1d4ed8; --accent-soft: #e4ebff;
  --good: #15803d; --bad: #b91c1c; --watch: #92400e;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font-display: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161c25; --surface-2: #1d2531; --ink: #e8edf3; --muted: #95a3b3; --line: rgba(232, 237, 243, 0.09);
    --hero: #1d2531; --hero-ink: #e8edf3; --hero-soft: #a3afbe;
    --accent: #8fb0ff; --accent-soft: #1c2a4d;
    --good: #6ee7a0; --bad: #fca5a5; --watch: #fcd34d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161c25; --surface-2: #1d2531; --ink: #e8edf3; --muted: #95a3b3; --line: rgba(232, 237, 243, 0.09);
  --hero: #1d2531; --hero-ink: #e8edf3; --hero-soft: #a3afbe;
  --accent: #8fb0ff; --accent-soft: #1c2a4d;
  --good: #6ee7a0; --bad: #fca5a5; --watch: #fcd34d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1.3; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 1024px) { .wrap { padding: 24px 32px 48px; gap: 20px; } }

/* ส่วนหัว */
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hd-left { display: flex; flex-direction: column; }
.hd-right { display: flex; align-items: center; gap: 8px; }
.pill-btn { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; min-height: 36px; font-size: 0.8125rem; }
.pill-btn:hover { background: var(--surface-2); }
.pill-btn svg { width: 16px; height: 16px; stroke-width: 1.5; }
.newbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 16px; font-size: 0.875rem; margin-bottom: 20px; }
.newbar::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

/* อารมณ์ตลาด: พื้นเป็นกลาง สีอยู่ที่หน้าปัดกับคำสรุปเท่านั้น */
.mood { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; color: var(--ink); }
.mood .g { color: var(--watch); }
.mood.pos .g { color: var(--good); }
.mood.neg .g { color: var(--bad); }
.mood svg { width: 64px; height: 36px; flex: 0 0 auto; }
.mood b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; display: block; line-height: 1.3; }
.mood b em { font-style: normal; }
.mood .why { font-size: 0.8125rem; color: var(--muted); }

/* ชีพจรตลาด */
.pulse { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .pulse { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tick { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; min-width: 0; }
.tick .n { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tick .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.tick .v { font-weight: 500; font-size: 1.0625rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tick .small { font-variant-numeric: tabular-nums; }
.tick svg { width: 56px; height: 20px; flex: 0 0 auto; }
.pulse-more { grid-column: 1 / -1; }
.up { color: var(--good); } .down { color: var(--bad); }

/* โครงหน้า */
.layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "today" "lead" "stories" "mine" "feed" "stats"; }
.col-left { display: contents; }
.a-today { grid-area: today; } .a-lead { grid-area: lead; } .a-stories { grid-area: stories; }
.a-mine { grid-area: mine; } .a-feed { grid-area: feed; } .a-stats { grid-area: stats; }
@media (min-width: 1024px) {
  .layout { grid-template-columns: 272px minmax(0, 1fr) 300px; align-items: start; grid-template-rows: auto auto 1fr;
    grid-template-areas: "left today mine" "left lead mine" "left feed mine"; }
  .col-left { display: flex; flex-direction: column; gap: 32px; grid-area: left; }
  .a-stories, .a-stats { grid-area: auto; }
  .side { position: sticky; top: 16px; }
}
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

/* วันนี้ต้องรู้ */
.today ol { margin: 0; padding: 12px 16px 12px 36px; display: flex; flex-direction: column; gap: 12px; }
.today .s { font-weight: 500; }
.today .t { display: block; color: var(--muted); font-size: 0.8125rem; transition: color 0.15s var(--ease); }
.today a:hover .t { color: var(--ink); }

/* ข่าวเด่น: การ์ดสีหมึก จุดเด่นเดียวของหน้า */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.hero .body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.hero-img { width: 100%; height: 180px; object-fit: cover; display: block; background: rgba(0,0,0,0.2); }
@media (min-width: 1024px) { .hero-img { height: 240px; } .hero .body { padding: 24px; } }
.hero .k { font-size: 0.8125rem; color: var(--hero-soft); }
.hero .t { font-family: var(--font-display); font-size: 1.375rem; font-weight: 500; line-height: 1.4; text-wrap: balance; }
@media (min-width: 1024px) { .hero .t { font-size: 1.625rem; } }
.hero .imp { border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px; font-size: 0.875rem; display: flex; flex-direction: column; gap: 4px; }
.hero .imp .up { color: #86efac; } .hero .imp .down { color: #fca5a5; } .hero .imp .w { color: #fde68a; }
.hero .imp .tk { color: var(--hero-soft); letter-spacing: 0.02em; }
.hero .src, .hero .past { font-size: 0.8125rem; color: var(--hero-soft); }
.hero .past { border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s var(--ease); }
.tile:hover { border-color: var(--muted); }
.tile .k { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.tile img { width: calc(100% + 24px); margin: -12px -12px 0; height: 96px; object-fit: cover; border-radius: 12px 12px 0 0; display: block; }
.tile .t { font-weight: 500; font-size: 0.9375rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.tile .src { font-size: 0.75rem; color: var(--muted); margin-top: auto; }

/* เรื่องติดตาม */
.stories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
.stories::-webkit-scrollbar { display: none; }
.story { flex: 0 0 72%; max-width: 280px; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.story:hover { background: var(--surface-2); }
.story .nm { font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.story .lt { font-size: 0.8125rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story .m { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.badge-new { color: var(--accent); font-size: 0.75rem; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.star { color: var(--watch); }
@media (min-width: 1024px) {
  .stories { flex-direction: column; overflow: visible; margin: 0; padding: 0; }
  .story { flex: none; max-width: none; }
}

/* หุ้นของคุณ */
.mine-list { display: flex; flex-direction: column; }
.stock-row { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.stock-row:hover { background: var(--surface-2); }
.stock-row:first-child { border-top: 0; border-radius: 12px 12px 0 0; }
.stock-row:last-child { border-radius: 0 0 12px 12px; }
.stock-row:only-child { border-radius: 12px; }
.stock-row b { font-weight: 500; letter-spacing: 0.02em; }
.stock-row .px { font-variant-numeric: tabular-nums; text-align: right; }
.stock-row .why { grid-column: 1 / -1; font-size: 0.75rem; color: var(--muted); }
.mark-up { color: var(--good); } .mark-down { color: var(--bad); } .mark-w { color: var(--watch); }
.mark-u, .hero .imp .u, .cell.u span { opacity: 0.55; }
.pf { font-size: 0.75em; color: var(--muted); white-space: nowrap; }
.pf.ok { color: var(--good); font-weight: 600; } .pf.bad { color: var(--bad); }
.hero .pf { color: var(--hero-soft); } .hero .pf.ok { color: #86efac; }
.empty { color: var(--muted); font-size: 0.875rem; padding: 12px 16px; }

/* กลุ่มหุ้น: พื้นเป็นกลาง สีอยู่ที่เครื่องหมาย ▲▼◆ */
.heat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(64px, auto); gap: 8px; }
@media (min-width: 1024px) { .heat { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-width: 0; color: var(--ink); transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease); }
.cell:hover { background: var(--surface-2); }
.cell b { font-weight: 500; font-size: 0.875rem; line-height: 1.35; overflow-wrap: anywhere; }
.cell span { font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.cell.big { grid-column: 1 / -1; }
.cell.big b { font-size: 1rem; }
.cell.up span { color: var(--good); }
.cell.down span { color: var(--bad); }
.cell.w span { color: var(--watch); }
.cell[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink); }

/* ฟีด */
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row-head .small { font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 1024px) { .chips { flex-wrap: wrap; margin: 0; padding: 0; } }
.chip { flex: 0 0 auto; white-space: nowrap; font-size: 0.875rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 4px 16px; min-height: 36px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 500; }
.news { list-style: none; margin: 0; padding: 0; }
.item { padding: 12px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item a { display: flex; gap: 12px; align-items: flex-start; }
.item a:hover .t { color: var(--accent); }
.item .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.item img { width: 72px; height: 56px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; }
.item .t { font-weight: 500; transition: color 0.15s var(--ease); }
.item .m { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.75rem; color: var(--muted); align-items: center; }
.tag { color: var(--muted); }
.sig { color: var(--ink); font-weight: 500; }
.yours { color: var(--accent); font-weight: 500; }
.dot-new { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); vertical-align: middle; margin-right: 8px; position: relative; top: -2px; }
.more { cursor: pointer; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; padding: 12px; color: var(--accent); font-weight: 500; border-radius: 0 0 12px 12px; }
.more:hover { background: var(--surface-2); }

/* สถิติ */
.stats { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 0.875rem; }
.stats .r { display: flex; justify-content: space-between; gap: 12px; }
.stats .r.sub { color: var(--muted); }
.stats .num { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; color: var(--ink); }
.stats .num i { font-style: normal; font-weight: 400; color: var(--muted); }
.stats hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* หน้ารายละเอียด (หุ้นรายตัว / เรื่องติดตาม) */
.detail { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.back { align-self: flex-start; }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dprice { font-size: 1.75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.chart { padding: 12px 8px 4px; }
.chart svg { width: 100%; height: 160px; display: block; }
.facts { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 0.875rem; }
.facts b { font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 4px 16px 12px; }
.tl li { position: relative; padding: 8px 0 8px 20px; border-left: 2px solid var(--line); margin-left: 4px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.tl li.hot::before { background: var(--watch); }
.tl li.isnew::before { background: var(--accent); }
.tl .d { font-size: 0.75rem; color: var(--muted); }
.disclaimer { color: var(--muted); font-size: 0.75rem; text-align: center; margin: 8px 0 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .chip, .story, .stock-row, .pill-btn, .more { transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease); }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd-left">
      <h1>กรองเศรษฐกิจ</h1>
      <span class="muted small" id="meta">กำลังโหลด…</span>
    </div>
    <div class="hd-right">
      <button class="pill-btn" type="button" id="themeBtn" aria-label="สลับโหมดสว่างหรือมืด"></button>
    </div>
  </header>

  <div class="mood" id="mood" hidden></div>
  <div class="pulse" id="pulse" aria-label="ภาพรวมตลาด"></div>

  <div id="home">
    <div class="newbar" id="newbar" hidden></div>
    <main class="layout">
      <section class="a-today" aria-labelledby="today-h">
        <h2 id="today-h">วันนี้ต้องรู้</h2>
        <div class="card today" id="today"></div>
      </section>

      <section class="a-lead" aria-label="ข่าวสำคัญ">
        <div id="hero"></div>
        <div class="grid2" id="top"></div>
      </section>

      <div class="col-left">
        <section class="a-stories" aria-labelledby="st-h">
          <h2 id="st-h">เรื่องที่กำลังเดิน</h2>
          <div class="stories side-stories" id="stories"></div>
        </section>

        <section class="a-stats" aria-labelledby="stat-h">
          <h2 id="stat-h">ความแม่นของสัญญาณ</h2>
          <div class="card stats" id="stats"><span class="muted">กำลังโหลด…</span></div>
        </section>
      </div>

      <section class="a-mine" aria-labelledby="mine-h">
        <div class="side">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div class="row-head"><h2 id="mine-h">หุ้นของคุณ</h2><span class="muted small" id="mine-n"></span></div>
            <div class="card mine-list" id="mine"></div>
            <h2 style="margin-top:16px">กลุ่มหุ้นวันนี้</h2>
            <div class="heat" id="heat"></div>
            <div class="card mine-list" id="affected" hidden></div>
          </div>
        </div>
      </section>

      <section class="a-feed" aria-labelledby="feed-h">
        <div class="row-head"><h2 id="feed-h">ข่าวทั้งหมด</h2><span class="muted small" id="count"></span></div>
        <div class="chips" role="group" aria-label="กรองข่าว" id="chips"></div>
        <div class="card"><ul class="news" id="news"></ul><button class="more" type="button" id="more" hidden>ดูข่าวเพิ่ม</button></div>
      </section>
    </main>
  </div>

  <div class="detail" id="detail" hidden></div>

  <p class="disclaimer">คัดกรองอัตโนมัติ ไม่ใช่คำแนะนำการลงทุน ตรวจสอบก่อนตัดสินใจทุกครั้ง</p>
</div>

<script>
(function () {
  "use strict";
  var S = { data: null, prices: {}, market: [], stats: null, tickers: {}, hist: {}, filter: "all", shown: 30, prevVisit: 0 };
  var EFFECT = { "ได้ประโยชน์": ["up", "▲"], "ถูกกดดัน": ["down", "▼"], "ต้องจับตา": ["w", "◆"] };
  // ชื่อที่ข่าวมักใช้เรียกหุ้น (ใช้หาข่าวของหุ้นแต่ละตัว นอกจากสัญญาณ)
  var ALIAS = { NVDA: ["Nvidia", "เอ็นวิเดีย"], AAPL: ["Apple"], TSM: ["TSMC"], MSFT: ["Microsoft"], AMD: ["AMD"], XOM: ["Exxon"],
    CVX: ["Chevron"], COP: ["ConocoPhillips"], JPM: ["JPMorgan"], BAC: ["Bank of America"], DAL: ["Delta Air"], UAL: ["United Airlines"],
    NEM: ["Newmont"], KBANK: ["KBANK"], SCB: ["SCB", "ไทยพาณิชย์"], BBL: ["BBL", "ธนาคารกรุงเทพ"], PTT: ["PTT", "ปตท."],
    PTTEP: ["PTTEP"], TOP: ["ไทยออยล์"], BCP: ["บางจาก"], AAV: ["AAV", "แอร์เอเชีย"], CPF: ["CPF", "ซีพีเอฟ"], TU: ["ไทยยูเนี่ยน"],
    DELTA: ["DELTA", "เดลต้า"], HANA: ["HANA"], KCE: ["KCE"], AURA: ["AURA"], LH: ["แลนด์ แอนด์ เฮ้าส์"], CPN: ["CPN", "เซ็นทรัลพัฒนา"] };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function ago(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " นาที";
    if (s < 86400) return Math.round(s / 3600) + " ชม.";
    return Math.round(s / 86400) + " วัน";
  }
  function fmtTime(iso, withDay) {
    try { return new Date(iso).toLocaleString("th-TH", withDay === false ? { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" } : { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" }); }
    catch (e) { return iso; }
  }
  function fmtNum(v) { return v == null ? "–" : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function pctHtml(ch) {
    if (ch == null) return "";
    return '<span class="' + (ch > 0 ? "up" : ch < 0 ? "down" : "") + '">' + (ch > 0 ? "▲ " : ch < 0 ? "▼ " : "") + Math.abs(ch).toFixed(2) + "%</span>";
  }
  function catName(it) { var n = S.data.meta.categories, c = it.categories[0]; return c ? (n[c] || c) : ""; }
  function imgTag(it, cls) {
    return it.image && /^https:\/\//.test(it.image) ? '<img' + (cls ? ' class="' + cls + '"' : "") + ' src="' + esc(it.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : "";
  }
  function spark(series, n) {
    if (!series || series.length < 3) return "";
    var v = series.slice(-(n || 10)).map(function (x) { return x[1]; }), lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), r = hi - lo || 1;
    var pts = v.map(function (y, i) { return (i * 56 / (v.length - 1)).toFixed(1) + "," + (20 - 18 * (y - lo) / r).toFixed(1); }).join(" ");
    return '<svg viewBox="0 0 56 22" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (v[v.length - 1] >= v[0] ? "var(--good)" : "var(--bad)") + '" stroke-width="2"/></svg>';
  }
  function sigById(id) { return (S.data.signals || []).filter(function (s) { return s.id === id; })[0]; }
  function isNew(it) { return S.prevVisit && new Date(it.published).getTime() > S.prevVisit; }
  function watch() { return store("watch") || []; }
  function follow() { return store("followStories") || []; }

  // หุ้นที่ข่าวนี้กระทบ (จากสัญญาณ + ชื่อหุ้นในหัวข่าว)
  function itemTickers(it) {
    var out = {};
    (it.signals || []).forEach(function (sid) {
      var s = sigById(sid);
      if (s) s.impacts.forEach(function (im) { (im.set || []).concat(im.us || []).forEach(function (t) { out[t] = 1; }); });
    });
    Object.keys(ALIAS).forEach(function (tk) {
      if (ALIAS[tk].some(function (a) { return new RegExp("(^|[^A-Za-z])" + a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^A-Za-z]|$)").test(it.title); })) out[tk] = 1;
    });
    return Object.keys(out);
  }
  function hitsWatch(it) { var w = watch(); return w.length && itemTickers(it).some(function (t) { return w.indexOf(t) >= 0; }); }

  // ข่าวสำคัญ: ใน 24 ชม. (ไม่พอขยายเป็น 72 ชม./7 วัน) เรียงตามคะแนน + สัญญาณ + กระทบหุ้นของคุณ
  function important(n) {
    var items = S.data.items, now = Date.now(), pool = [];
    [24, 72, 168].some(function (h) { pool = items.filter(function (it) { return now - new Date(it.published).getTime() <= h * 3600000; }); return pool.length >= 5; });
    function sc(it) { return it.score + (it.signals && it.signals.length ? 2 : 0) + (hitsWatch(it) ? 3 : 0) + (it.stories && it.stories.length ? 1 : 0); }
    return pool.slice().sort(function (a, b) { return sc(b) - sc(a) || (b.published > a.published ? 1 : -1); }).slice(0, n);
  }
  // ผลทดสอบกฎกับราคาจริงย้อนหลัง (validation.json): confirmed / unclear / contrary
  function proof(sid, sector) {
    var v = S.val && S.val.rules;
    if (!v) return null;
    return v.filter(function (r) { return r.signal === sid && r.sector === sector; })[0] || { status: "unclear", events: 0 };
  }
  function proofTag(pr) {
    if (!pr) return "";
    if (pr.status === "confirmed") return ' <span class="pf ok" title="ทดสอบกับราคาย้อนหลัง ' + pr.events + ' ครั้ง">✓ ถูก ' + pr.hit_after.toFixed(0) + "%</span>";
    return ' <span class="pf" title="ข้อมูลย้อนหลังยังพิสูจน์ไม่ได้ว่ากฎนี้แม่น">ยังไม่พิสูจน์</span>';
  }
  function impactParts(it) {
    var parts = [];
    (it.signals || []).forEach(function (sid) {
      var s = sigById(sid); if (!s) return;
      s.impacts.forEach(function (im) {
        var e = EFFECT[im.effect] || ["w", "◆"], pr = proof(sid, im.sector);
        if (pr && pr.status === "contrary") return; // ข้อมูลบอกว่ากฎนี้ทายกลับทาง: ไม่แสดง
        var weak = pr && pr.status !== "confirmed" && e[0] !== "w";
        parts.push({ cls: weak ? e[0] + " u" : e[0], mark: e[1], sector: im.sector, tks: (im.set || []).concat(im.us || []), pr: pr, ok: pr && pr.status === "confirmed" });
      });
    });
    // กฎที่พิสูจน์แล้วขึ้นก่อน
    return parts.sort(function (a, b) { return (b.ok ? 1 : 0) - (a.ok ? 1 : 0); });
  }

  /* ---------- แสดงผล: หน้าแรก ---------- */
  function renderPulse() {
    var wide = window.matchMedia && window.matchMedia("(min-width: 1024px)").matches;
    var mk = S.market, lim = S.allMarket || wide ? mk.length : 4;
    $("pulse").innerHTML = mk.slice(0, lim).map(function (m) {
      // ดัชนี SET: Yahoo ไม่มีราคาย้อนหลัง ระบบเก็บเองวันละจุด ระหว่างที่ยังไม่ครบ 5 วัน ใช้กราฟ TDEX (ETF ตามดัชนี SET50) แทน
      var series = S.hist["M:" + m.key], proxy = false;
      if (m.key === "SET" && (!series || series.length < 5) && S.hist["^SET"]) { series = S.hist["^SET"]; proxy = true; }
      return '<div class="tick"' + (proxy ? ' title="กราฟจาก TDEX (SET50) ระหว่างรอเก็บข้อมูลดัชนี SET"' : "") + '><span class="n">' + esc(m.name) + '</span><div class="row"><span class="v">' + fmtNum(m.price) + "</span>" + spark(series) +
        '</div><span class="small">' + pctHtml(m.change_pct) + "</span></div>";
    }).join("") + (mk.length > lim ? '<button class="chip pulse-more" type="button" id="moreMk">ตลาดอื่น ' + (mk.length - lim) + " ตัว ▾</button>" : "");
    renderMood();
  }

  // อารมณ์ตลาด: นับจากดัชนี (SET, S&P 500), VIX และสัญญาณข่าว แล้วสรุปเป็นคำเดียว
  function renderMood() {
    if (!S.market.length || !S.data) return;
    var by = {}, score = 0, why = [];
    S.market.forEach(function (m) { by[m.key] = m.change_pct; });
    [["SET", "SET "], ["SPX", "ตลาดสหรัฐ"]].forEach(function (k) {
      var c = by[k[0]]; if (c == null) return;
      if (c >= 0.3) { score++; why.push(k[1] + "บวก"); } else if (c <= -0.3) { score--; why.push(k[1] + "ลบ"); }
    });
    if (by.VIX != null && by.VIX >= 5) { score--; why.push("ความกลัวพุ่ง"); }
    if (by.VIX != null && by.VIX <= -5) { score++; }
    (S.data.signals || []).slice(0, 2).forEach(function (s) { why.push(s.name); });
    var cls = score >= 1 ? "pos" : score <= -1 ? "neg" : "neu", word = { pos: "บวก", neu: "ระวัง", neg: "ลบ" }[cls];
    var ang = Math.PI * (1 - (Math.max(-2, Math.min(2, score)) + 2) / 4), x = 38 + 26 * Math.cos(ang), y = 40 - 26 * Math.sin(ang);
    $("mood").className = "mood " + cls; $("mood").hidden = false;
    $("mood").innerHTML = '<svg class="g" viewBox="0 0 76 44" aria-hidden="true"><path d="M8 40 A30 30 0 0 1 68 40" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-width="7"/>' +
      '<path d="M8 40 A30 30 0 0 1 68 40" fill="none" stroke="currentColor" stroke-width="7" stroke-dasharray="' + (94.2 * (Math.PI - ang) / Math.PI).toFixed(1) + ' 200"/>' +
      '<line x1="38" y1="40" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="38" cy="40" r="3" fill="currentColor"/></svg>' +
      "<div><b>วันนี้: <em class=\"g\">" + word + "</em></b><span class=\"why\">" + esc(why.slice(0, 3).join(" · ") || "ยังไม่มีสัญญาณชัด") + "</span></div>";
  }

  function renderToday() {
    // เลือกข่าวที่สัญญาณไม่ซ้ำกัน จะได้ไม่เห็นบรรทัดเดิมสามครั้ง
    var seen = {}, top = important(12).filter(function (it) { var k = (it.signals || [])[0] || it.id || it.link; if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 3);
    if (!top.length) { $("today").innerHTML = '<div class="empty">ยังไม่มีข่าวสำคัญ</div>'; return; }
    $("today").innerHTML = "<ol>" + top.map(function (it) {
      var p = impactParts(it), s = (it.signals || [])[0] && sigById(it.signals[0]), line;
      if (s && p.length) {
        line = esc(s.name) + " → " + p.slice(0, 2).map(function (x) { return '<span class="' + x.cls.split(" ").map(function (c) { return "mark-" + c; }).join(" ") + '">' + x.mark + " " + esc(x.sector) + "</span>" + (x.ok ? proofTag(x.pr) : ""); }).join(", ");
      } else {
        line = esc(catName(it) || "ข่าวเด่น");
      }
      return '<li><a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener noreferrer"><span class="s">' + line + '</span><span class="t">' + esc(it.title) + "</span></a></li>";
    }).join("") + "</ol>";
  }

  function pastHtml(it) {
    var ok = impactParts(it).filter(function (x) { return x.ok; })[0];
    if (ok) return '<div class="past">ทดสอบย้อนหลัง: ' + esc(ok.pr.proxy || "") + " " + ok.pr.events + " ครั้ง กลุ่ม" + esc(ok.sector) + " ไปตามที่ทาย " + ok.pr.hit_after.toFixed(0) + "% ใน 5 วันทำการถัดมา</div>";
    if (S.val && (it.signals || []).length) return '<div class="past">กฎของข่าวนี้ยังไม่ผ่านการทดสอบกับข้อมูลย้อนหลัง ใช้เป็นข้อสังเกต ไม่ใช่สัญญาณซื้อขาย</div>';
    var st = S.stats, sid = (it.signals || [])[0];
    if (!st || !sid) return "";
    var s = (st.signals || []).filter(function (x) { return x.id === sid; })[0];
    // แสดงเฉพาะสัญญาณที่แม่นจริง: ถูกทาง 55% ขึ้นไป จากการวัดอย่างน้อย 20 ครั้ง (ต่ำกว่านั้นไม่ต่างจากเดาสุ่ม)
    if (!s || !s.d5 || s.d5.evaluated < 20 || s.d5.hit_rate == null || s.d5.hit_rate < 55) return "";
    return '<div class="past">ย้อนหลัง: สัญญาณนี้มาจากข่าว ' + s.news + " ข่าว ทายถูกทาง " + s.d5.hit_rate.toFixed(0) + "% ใน 5 วันทำการ (" + s.d5.evaluated + " ครั้ง)</div>";
  }

  function renderLead() {
    var top = important(5);
    if (!top.length) { $("hero").innerHTML = ""; $("top").innerHTML = ""; return; }
    var h = top[0], p = impactParts(h);
    var imp = p.slice(0, 3).map(function (x) { return '<div><span class="' + x.cls + '">' + x.mark + " " + esc(x.sector) + "</span>" + (x.ok ? proofTag(x.pr) : "") + (x.tks.length ? ' <span class="tk">' + esc(x.tks.slice(0, 4).join(" ")) + "</span>" : "") + "</div>"; }).join("");
    $("hero").innerHTML = '<a class="hero" href="' + esc(safeUrl(h.link)) + '" target="_blank" rel="noopener noreferrer">' +
      imgTag(h, "hero-img") + '<div class="body">' +
      '<span class="k">ข่าวสำคัญที่สุด · ' + esc(catName(h)) + (hitsWatch(h) ? " · กระทบหุ้นของคุณ" : "") + "</span>" +
      '<span class="t">' + esc(h.title) + "</span>" + (imp ? '<div class="imp">' + imp + "</div>" : "") + pastHtml(h) +
      '<span class="src">' + esc(h.source) + " · " + ago(h.published) + "</span></div></a>";
    $("top").innerHTML = top.slice(1).map(function (it) {
      var s = (it.signals || [])[0] && sigById(it.signals[0]);
      return '<a class="tile" href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener noreferrer">' + imgTag(it) + '<span class="k">' +
        esc(s ? s.name : catName(it)) + (hitsWatch(it) ? ' <span class="yours">· หุ้นคุณ</span>' : "") + '</span><span class="t">' + esc(it.title) +
        '</span><span class="src">' + esc(it.source) + " · " + ago(it.published) + "</span></a>";
    }).join("");
  }

  function storyNew(id) { return S.data.items.filter(function (i) { return (i.stories || []).indexOf(id) >= 0 && isNew(i); }).length; }
  function renderStories() {
    var list = (S.data.stories || []).slice(), f = follow();
    list.sort(function (a, b) { return (f.indexOf(b.id) >= 0) - (f.indexOf(a.id) >= 0); });
    if (!list.length) { $("stories").innerHTML = '<div class="empty">ยังไม่มีเรื่องต่อเนื่อง</div>'; return; }
    $("stories").innerHTML = list.map(function (s) {
      var nNew = storyNew(s.id);
      return '<button class="story" type="button" data-story="' + esc(s.id) + '"><span class="nm"><span>' + (f.indexOf(s.id) >= 0 ? '<span class="star">★</span> ' : "") + esc(s.name) + "</span>" +
        (nNew ? '<span class="badge-new">ใหม่ ' + nNew + "</span>" : s.new_24h ? '<span class="badge-new">+' + s.new_24h + " วันนี้</span>" : "") + '</span><span class="lt">' + esc(s.latest_title) +
        '</span><span class="m"><span>' + s.count + " ข่าว</span><span>ล่าสุด " + ago(s.latest) + "</span></span></button>";
    }).join("");
  }

  function stockRow(tk, why, cls, mark) {
    var p = S.prices[tk];
    return '<button class="stock-row" type="button" data-stock="' + esc(tk) + '"><span><b class="' + (cls ? "mark-" + cls : "") + '">' + (mark ? mark + " " : "") + esc(tk) +
      '</b></span><span class="px">' + (p ? fmtNum(p.price) + " " + pctHtml(p.change_pct) : "") + '</span><span class="why">' + esc(why) + "</span></button>";
  }
  function renderMine() {
    var w = watch();
    $("mine-n").textContent = w.length ? w.length + " ตัว" : "";
    if (!w.length) {
      $("mine").innerHTML = '<div class="empty">แตะชื่อหุ้นเพื่อเปิดหน้าหุ้น แล้วกด ☆ ติดตาม ข่าวที่กระทบหุ้นของคุณจะขึ้นก่อนเสมอ</div>';
    } else {
      $("mine").innerHTML = w.map(function (tk) {
        var rel = S.data.items.filter(function (it) { return itemTickers(it).indexOf(tk) >= 0; });
        return stockRow(tk, rel.length ? rel.length + " ข่าว · ล่าสุด: " + rel[0].title : "ยังไม่มีข่าวที่เกี่ยวข้อง");
      }).join("");
    }
    var map = {}, order = [];
    (S.data.signals || []).forEach(function (s) {
      s.impacts.forEach(function (im) {
        var e = EFFECT[im.effect] || ["w", "◆"];
        (im.set || []).concat(im.us || []).forEach(function (tk) {
          var cur = map[tk];
          if (!cur) { map[tk] = { cls: e[0], mark: e[1], why: s.name }; order.push(tk); return; }
          if (cur.why.indexOf(s.name) < 0) cur.why += ", " + s.name;
          if (cur.cls === e[0] || e[0] === "w") return;
          if (cur.cls === "w") { cur.cls = e[0]; cur.mark = e[1]; return; }
          cur.cls = "w"; cur.mark = "◆";
        });
      });
    });
    renderHeat();
  }

  // แผนที่สีกลุ่มหุ้น: หนึ่งช่องต่อกลุ่ม สีตามผลกระทบ ช่องใหญ่ = ข่าวมากสุด แตะเพื่อดูหุ้นในกลุ่ม
  function renderHeat() {
    var sec = {}, list = [];
    (S.data.signals || []).forEach(function (s) {
      s.impacts.forEach(function (im) {
        var e = EFFECT[im.effect] || ["w", "◆"], k = im.sector, c = sec[k], pr = proof(s.id, im.sector);
        if (pr && pr.status === "contrary") return;
        if (!c) { c = sec[k] = { name: k, cls: e[0], mark: e[1], n: 0, tks: [], why: [], ok: false }; list.push(c); }
        else if (c.cls !== e[0]) { c.cls = "w"; c.mark = "◆"; }
        if (pr && pr.status === "confirmed") c.ok = true;
        c.n += s.count; if (c.why.indexOf(s.name) < 0) c.why.push(s.name);
        (im.set || []).concat(im.us || []).forEach(function (t) { if (c.tks.indexOf(t) < 0) c.tks.push(t); });
      });
    });
    list.sort(function (a, b) { return b.n - a.n; });
    if (!list.length) { $("heat").innerHTML = '<div class="empty">ยังไม่มีสัญญาณใน 48 ชม.</div>'; $("affected").hidden = true; return; }
    $("heat").innerHTML = list.slice(0, 9).map(function (c, i) {
      return '<button class="cell ' + c.cls + (S.val && !c.ok && c.cls !== "w" ? " u" : "") + (i === 0 ? " big" : "") + '" type="button" data-sector="' + esc(c.name) + '" aria-pressed="' + (S.sector === c.name) + '"><b>' + esc(c.name) +
        "</b><span>" + c.mark + " " + c.n + " ข่าว" + (c.ok ? " · ✓" : "") + "</span></button>";
    }).join("");
    var cur = list.filter(function (c) { return c.name === S.sector; })[0];
    $("affected").hidden = !cur;
    if (cur) $("affected").innerHTML = cur.tks.map(function (tk) { return stockRow(tk, cur.why.join(", "), cur.cls, cur.mark); }).join("");
  }

  function renderChips() {
    var names = S.data.meta.categories, counts = {};
    S.data.items.forEach(function (it) { it.categories.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; }); });
    var opts = [["all", "ทั้งหมด"]];
    if (watch().length) opts.push(["mine", "หุ้นของคุณ"]);
    if (S.prevVisit) opts.push(["new", "ใหม่"]);
    opts.push(["r:TH", "ไทย"], ["r:GLOBAL", "ต่างประเทศ"]);
    Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).forEach(function (c) { opts.push(["c:" + c, names[c] || c]); });
    $("chips").innerHTML = opts.map(function (o) { return '<button class="chip" type="button" data-f="' + esc(o[0]) + '" aria-pressed="' + (S.filter === o[0]) + '">' + esc(o[1]) + "</button>"; }).join("");
  }
  function newsLi(it) {
    var s = (it.signals || [])[0] && sigById(it.signals[0]);
    return '<li class="item"><a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener noreferrer"><span class="txt"><span class="t">' + (isNew(it) ? '<span class="dot-new" aria-label="ใหม่"></span>' : "") + esc(it.title) +
      '</span><span class="m"><span class="tag">' + esc(catName(it)) + "</span><span>" + esc(it.source) + "</span><span>" + ago(it.published) + "</span>" +
      (s ? '<span class="sig">' + esc(s.name) + "</span>" : "") + (hitsWatch(it) ? '<span class="yours">หุ้นคุณ</span>' : "") + "</span></span>" + imgTag(it) + "</a></li>";
  }
  function renderFeed() {
    var f = S.filter;
    var items = S.data.items.filter(function (it) {
      if (f === "all") return true;
      if (f === "mine") return hitsWatch(it);
      if (f === "new") return isNew(it);
      if (f.indexOf("r:") === 0) return it.region === f.slice(2);
      return it.categories.indexOf(f.slice(2)) >= 0;
    });
    $("count").textContent = items.length + " ข่าว";
    $("news").innerHTML = items.length ? items.slice(0, S.shown).map(newsLi).join("") : '<li class="empty">ไม่มีข่าวในตัวกรองนี้</li>';
    $("more").hidden = items.length <= S.shown;
  }

  function renderStats() {
    var st = S.stats, el = $("stats");
    if (!st || !st.overall) { el.innerHTML = '<span class="muted">เริ่มเก็บข้อมูลรอบถัดไป</span>'; return; }
    var o = st.overall, d5 = o.d5, d1 = o.d1;
    function pct(v) { return v == null ? "–" : v.toFixed(0) + "%"; }
    var html = '<div class="r"><span>ข่าวที่มีสัญญาณ</span><span class="num">' + (o.news || o.total) + " ข่าว</span></div>" +
      '<div class="r"><span>ถูกทาง หลัง 1 วัน</span><span class="num">' + pct(d1.hit_rate) + " <i>(" + d1.evaluated + ")</i></span></div>" +
      '<div class="r"><span>ถูกทาง หลัง 5 วัน</span><span class="num">' + pct(d5.hit_rate) + " <i>(" + d5.evaluated + ")</i></span></div><hr>";
    (st.signals || []).filter(function (s) { return s.d5.evaluated > 0; }).slice(0, 6).forEach(function (s) {
      html += '<div class="r sub"><span>' + esc(s.name) + '</span><span class="num">' + pct(s.d5.hit_rate) + " <i>(" + s.d5.evaluated + ")</i></span></div>";
    });
    var years = Object.keys(st.by_year || {}).filter(function (y) { return st.by_year[y].evaluated > 0; });
    if (years.length > 1) years.forEach(function (y) { html += '<div class="r sub"><span>ปี ' + esc(y) + '</span><span class="num">' + pct(st.by_year[y].hit_rate) + " <i>(" + st.by_year[y].evaluated + ")</i></span></div>"; });
    html += '<span class="muted small">ถูกทาง = ▲ แล้วหุ้นชนะดัชนี หรือ ▼ แล้วหุ้นแพ้ดัชนี ในวงเล็บคือจำนวนครั้งที่วัดได้' + (d5.evaluated < 30 ? " ข้อมูลยังน้อย อย่าเพิ่งเชื่อตัวเลขนี้" : "") +
      (st.since ? " ข้อมูลตั้งแต่ " + esc(st.since) : "") + (st.backfill ? " (รวมข่าวต่างประเทศย้อนหลัง " + st.backfill + " รายการ)" : "") + "</span>";
    var v = S.val && S.val.rules;
    if (v && v.length) {
      var ok = v.filter(function (r) { return r.status === "confirmed"; }), bad = v.filter(function (r) { return r.status === "contrary"; });
      html += "<hr><b>ทดสอบกฎกับราคาย้อนหลัง</b>" + '<div class="r"><span>พิสูจน์แล้ว / สวนทาง / ยังไม่ชัด</span><span class="num">' + ok.length + " / " + bad.length + " / " + (v.length - ok.length - bad.length) + "</span></div>";
      ok.concat(bad).forEach(function (r) {
        html += '<div class="r sub"><span>' + (r.status === "confirmed" ? "✓ " : "✗ ") + esc(r.signal_name) + " → " + esc(r.sector) + '</span><span class="num">' + r.hit_after.toFixed(0) + "% <i>(" + r.events + ")</i></span></div>";
      });
      html += '<span class="muted small">นับเฉพาะเหตุการณ์อย่างน้อย ' + S.val.min_events + " ครั้ง และต้องผ่านเกณฑ์สถิติ (ช่วงความเชื่อมั่น 90% ไม่คร่อม 50%) วัดจากราคาปิดหลังวันเกิดเหตุ เทียบดัชนี</span>";
    }
    el.innerHTML = html;
  }

  /* ---------- หน้ารายละเอียด ---------- */
  function sparkline(series) {
    if (!series || series.length < 5) return '<div class="empty">ยังไม่มีราคาย้อนหลังพอวาดกราฟ</div>';
    var w = 600, h = 160, pad = 6, vals = series.map(function (x) { return x[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = hi - lo || 1;
    var pts = vals.map(function (v, i) { return [pad + i * (w - 2 * pad) / (vals.length - 1), pad + (h - 2 * pad) * (1 - (v - lo) / rng)]; });
    var line = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var up = vals[vals.length - 1] >= vals[0], col = up ? "var(--good)" : "var(--bad)", last = pts[pts.length - 1];
    return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="กราฟราคาย้อนหลัง">' +
      '<line x1="0" x2="' + w + '" y1="' + (h / 2) + '" y2="' + (h / 2) + '" stroke="var(--line)" stroke-dasharray="4 4"/>' +
      '<polygon points="' + pad + "," + h + " " + line + " " + last[0].toFixed(1) + "," + h + '" fill="' + col + '" opacity="0.12"/>' +
      '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="' + col + '"/></svg>' +
      '<div class="r muted small" style="display:flex;justify-content:space-between;padding:0 8px"><span>' + esc(series[0][0]) + "</span><span>ต่ำสุด " + fmtNum(lo) + " · สูงสุด " + fmtNum(hi) + "</span><span>" + esc(series[series.length - 1][0]) + "</span></div>";
  }

  function stockPage(tk) {
    var p = S.prices[tk] || {}, info = S.tickers[tk] || { sectors: [], signals: [] }, w = watch(), on = w.indexOf(tk) >= 0;
    var rel = S.data.items.filter(function (it) { return itemTickers(it).indexOf(tk) >= 0; });
    var rec = S.stats && S.stats.tickers && S.stats.tickers[tk];
    var sigs = info.signals.map(function (s) {
      var e = EFFECT[s.effect] || ["w", "◆"], prs = (S.val && S.val.rules || []).filter(function (r) { return r.signal === s.id && (s.sector ? r.sector === s.sector : info.sectors.indexOf(r.sector) >= 0); }), pr = prs.filter(function (r) { return r.status === "confirmed"; })[0] || prs.filter(function (r) { return r.status === "contrary"; })[0] || prs[0];
      var note = !pr ? "" : pr.status === "confirmed" ? '<div class="pf ok">✓ ทดสอบย้อนหลัง ' + pr.events + " ครั้ง: ไปตามที่ทาย " + pr.hit_after.toFixed(0) + "%</div>" :
        pr.status === "contrary" ? '<div class="pf bad">✗ ทดสอบย้อนหลัง ' + pr.events + " ครั้ง: ไปตามที่ทายแค่ " + pr.hit_after.toFixed(0) + "% กฎนี้ไม่ควรเชื่อ</div>" :
        '<div class="pf">ยังไม่พิสูจน์' + (pr.events ? " (ทดสอบได้ " + pr.events + " ครั้ง ถูก " + pr.hit_after.toFixed(0) + "%)" : "") + "</div>";
      return '<div><span class="mark-' + e[0] + '">' + e[1] + " " + esc(s.name) + "</span> <span class=\"muted\">· " + esc(s.why) + "</span>" + note + "</div>"; }).join("");
    return '<button class="pill-btn back" type="button" data-nav="">← กลับหน้าแรก</button>' +
      '<div class="dhead"><div><h1>' + esc(tk) + '</h1><span class="muted small">' + esc(info.market === "SET" ? "หุ้นไทย (SET)" : "หุ้นสหรัฐ") + " · " + esc(info.sectors.join(", ")) + "</span></div>" +
      '<button class="pill-btn" type="button" data-watch="' + esc(tk) + '">' + (on ? "★ ติดตามอยู่" : "☆ ติดตาม") + "</button></div>" +
      '<div><span class="dprice">' + fmtNum(p.price) + "</span> " + pctHtml(p.change_pct) + ' <span class="muted small">' + esc(p.currency || "") + (p.asof ? " · " + fmtTime(p.asof) : "") + "</span></div>" +
      '<div class="card chart">' + sparkline(S.hist[tk]) + "</div>" +
      '<div class="card facts"><b>ข่าวแบบไหนกระทบหุ้นนี้</b>' + (sigs || '<span class="muted">ยังไม่มีกฎสำหรับหุ้นนี้</span>') +
      (rec && rec.evaluated ? '<div class="muted">ย้อนหลัง: สัญญาณของหุ้นนี้ถูกทาง ' + rec.hit_rate.toFixed(0) + "% ใน 5 วันทำการ (" + rec.evaluated + " ครั้ง)</div>" : "") + "</div>" +
      '<h2>ข่าวที่เกี่ยวข้อง (' + rel.length + ")</h2>" +
      '<div class="card"><ul class="news">' + (rel.length ? rel.slice(0, 40).map(newsLi).join("") : '<li class="empty">ยังไม่มีข่าวที่เกี่ยวข้องใน 30 วันล่าสุด</li>') + "</ul></div>";
  }

  function storyPage(id) {
    var s = (S.data.stories || []).filter(function (x) { return x.id === id; })[0];
    if (!s) return '<button class="pill-btn back" type="button" data-nav="">← กลับหน้าแรก</button><div class="empty">ไม่พบเรื่องนี้</div>';
    var its = S.data.items.filter(function (i) { return (i.stories || []).indexOf(id) >= 0; }).sort(function (a, b) { return a.published < b.published ? 1 : -1; });
    var on = follow().indexOf(id) >= 0, tks = {};
    its.forEach(function (it) { itemTickers(it).forEach(function (t) { tks[t] = (tks[t] || 0) + 1; }); });
    var tkList = Object.keys(tks).sort(function (a, b) { return tks[b] - tks[a]; }).slice(0, 8);
    var lastDay = "";
    var tl = its.map(function (it) {
      var day = new Date(it.published).toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Bangkok" });
      var head = day !== lastDay ? '<li style="border-left-color:transparent;padding-bottom:0"><b>' + esc(day) + "</b></li>" : "";
      lastDay = day;
      var sg = (it.signals || [])[0] && sigById(it.signals[0]);
      return head + '<li class="' + (isNew(it) ? "isnew" : sg ? "hot" : "") + '"><a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener noreferrer"><div>' + esc(it.title) +
        '</div><div class="d">' + fmtTime(it.published, false) + " · " + esc(it.source) + (sg ? " · " + esc(sg.name) : "") + (isNew(it) ? ' · <span class="badge-new">ใหม่</span>' : "") + "</div></a></li>";
    }).join("");
    return '<button class="pill-btn back" type="button" data-nav="">← กลับหน้าแรก</button>' +
      '<div class="dhead"><div><h1>' + esc(s.name) + '</h1><span class="muted small">' + its.length + " ข่าวใน 30 วัน · ล่าสุด " + ago(s.latest) + "</span></div>" +
      '<button class="pill-btn" type="button" data-follow="' + esc(id) + '">' + (on ? "★ ติดตามอยู่" : "☆ ติดตามเรื่องนี้") + "</button></div>" +
      (tkList.length ? '<div class="chips">' + tkList.map(function (t) { return '<button class="chip" type="button" data-stock="' + esc(t) + '">' + esc(t) + " " + (S.prices[t] ? pctHtml(S.prices[t].change_pct) : "") + "</button>"; }).join("") + "</div>" : "") +
      '<h2>ไทม์ไลน์</h2><div class="card"><ul class="tl">' + tl + "</ul></div>";
  }

  /* ---------- การนำทาง (#stock-XXX / #story-xxx) ---------- */
  function route() {
    if (!S.data) return;
    var h = location.hash.slice(1), m;
    if ((m = /^stock-([A-Z0-9.^]+)$/.exec(h))) { $("detail").innerHTML = stockPage(m[1]); show(true); }
    else if ((m = /^story-([a-z0-9-]+)$/.exec(h))) { $("detail").innerHTML = storyPage(m[1]); show(true); }
    else { show(false); }
  }
  function show(detail) { $("home").hidden = detail; $("detail").hidden = !detail; if (detail) window.scrollTo(0, 0); }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  window.addEventListener("hashchange", route);

  function renderHome() { renderPulse(); renderToday(); renderLead(); renderStories(); renderMine(); renderChips(); renderFeed(); renderStats(); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t || !S.data) return;
    if (t.dataset.f) { S.filter = t.dataset.f; S.shown = 30; renderChips(); renderFeed(); }
    else if (t.id === "more") { S.shown += 30; renderFeed(); }
    else if (t.id === "moreMk") { S.allMarket = true; renderPulse(); }
    else if (t.dataset.sector) { S.sector = S.sector === t.dataset.sector ? null : t.dataset.sector; renderHeat(); }
    else if (t.dataset.stock) { go("#stock-" + t.dataset.stock); }
    else if (t.dataset.story) { go("#story-" + t.dataset.story); }
    else if (t.hasAttribute("data-nav")) { history.pushState("", document.title, location.pathname + location.search); route(); }
    else if (t.dataset.watch) {
      var w = watch(), i = w.indexOf(t.dataset.watch);
      if (i >= 0) w.splice(i, 1); else w.push(t.dataset.watch);
      store("watch", w); renderHome(); route();
    } else if (t.dataset.follow) {
      var f = follow(), j = f.indexOf(t.dataset.follow);
      if (j >= 0) f.splice(j, 1); else f.push(t.dataset.follow);
      store("followStories", f); renderStories(); route();
    }
  });

  /* ---------- โหมดสว่าง/มืด ---------- */
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function curTheme() { var t = document.documentElement.getAttribute("data-theme"); if (t) return t; return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  function paintTheme() { var d = curTheme() === "dark"; $("themeBtn").innerHTML = (d ? SUN : MOON) + "<span>" + (d ? "สว่าง" : "มืด") + "</span>"; }
  $("themeBtn").addEventListener("click", function () { var n = curTheme() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("theme", n); } catch (e) {} paintTheme(); });
  paintTheme();

  /* ---------- โหลดข้อมูล ---------- */
  // "ตั้งแต่เข้ามาครั้งก่อน": จำเวลาที่เปิดล่าสุด (นับครั้งใหม่ถ้าห่างกันเกิน 30 นาที)
  (function () {
    var v = store("visit") || {}, now = Date.now();
    if (!v.last || now - v.last > 30 * 60000) { S.prevVisit = v.last || 0; store("visit", { last: now, prev: v.last || 0 }); }
    else { S.prevVisit = v.prev || 0; }
  })();

  function getJSON(name, win) {
    if (window[win]) return Promise.resolve(window[win]);
    return fetch(name, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }
  getJSON("news.json", "__NEWS__").then(function (data) {
    if (!data) { $("meta").textContent = "โหลดข่าวไม่สำเร็จ ลองรีเฟรชอีกครั้ง"; return; }
    S.data = data;
    $("meta").textContent = "อัปเดต " + fmtTime(data.meta.generated_at) + " · % เทียบราคาปิดก่อนหน้า";
    var nNew = S.prevVisit ? data.items.filter(isNew).length : 0;
    if (nNew) { $("newbar").hidden = false; $("newbar").innerHTML = "<span>มีข่าวใหม่ <b>" + nNew + "</b> ข่าว ตั้งแต่เข้ามาครั้งก่อน (" + fmtTime(new Date(S.prevVisit).toISOString()) + ')</span><button class="chip" type="button" data-f="new" style="margin-left:auto">ดูเฉพาะข่าวใหม่</button>'; }
    renderHome(); route();
    return Promise.all([getJSON("prices.json", "__PRICES__"), getJSON("stats.json", "__STATS__"), getJSON("tickers.json", "__TICKERS__"), getJSON("history.json", "__HIST__"), getJSON("validation.json", "__VAL__")]);
  }).then(function (r) {
    if (!r) return;
    if (r[0]) { S.prices = r[0].prices || {}; S.market = r[0].market || []; }
    S.stats = r[1]; S.tickers = r[2] || {}; S.hist = r[3] || {}; S.val = r[4];
    renderHome(); route();
  });
})();
</script>
</body>
</html>
